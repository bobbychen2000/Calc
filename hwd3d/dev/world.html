<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HWD world (dev)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #hud { position: absolute; left: 8px; top: 8px; right: 8px; color: #e8eef6; font: 12px/1.35 system-ui, sans-serif; pointer-events: none;
         text-shadow: 0 1px 2px #000; white-space: pre-wrap; }
  #views { position: absolute; left: 8px; bottom: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  #views button { font: 13px system-ui, sans-serif; padding: 8px 10px; min-height: 36px; border: 0; border-radius: 6px; background: rgba(20,24,30,.78); color: #e8eef6; }
  body.shot #hud, body.shot #views { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="views"></div>
<!-- dev page for the HWD world only (P2, Phase 2): ?view=<name> ?ground=naip|procedural ?q=high|low ?t=<ISO UTC>
     ?metar=<raw> ?scale=<render scale> ?shot=1 (no HUD; window.HWDW.shot(name) returns a PNG data URL) -->
<script type="module" src="./world.js"></script>
</body>
</html>
