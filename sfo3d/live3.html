<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SFO Live 3D</title>
<!--
  SFO Live 3D on the three.js r186 renderer (WebGPU, automatic WebGL 2 fallback). Same app, entry logic, UI and QA hooks
  as live.html: the import map below swaps only the renderer-facing modules (docs/research/engine_impl.md §2).
  ?mode=snapshot|live as live.html; ?tier=high|medium|low forces a quality tier; ?webgl=1 forces the WebGL 2 backend.
-->
<script type="importmap">
{
  "imports": {
    "./js/gl.js": "./js/three/compat/gl.js",
    "./js/renderer.js": "./js/three/compat/renderer.js",
    "./js/scene.js": "./js/three/compat/scene.js",
    "./js/world/world.js": "./js/three/compat/world.js"
  },
  "scopes": {
    "./js/three/": {
      "./js/renderer.js": "./js/renderer.js",
      "./js/world/world.js": "./js/world/world.js"
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="live.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="js/live/entry.js"></script>
</body></html>
