<!doctype html>
<html><head><meta charset="utf-8"><title>sky test</title>
<!-- Dev check of the environment step-3 sky without the airport (docs/research/environment_impl.md §3): Engine + Sky with
     an EnvState of a real-weather preset (?wx=, default marine_layer): physical light (C171 calibration, cloud
     adjustment), fog slabs, the N cloud layers (sky shader + planes), the Moon, rain particles, a ground plane and a
     row of boxes, the exposure meter readback. Reports window.__skytest = {ok, err, info}. ?cam=x,y,z,yaw,pitch -->
<script type="importmap">
{ "imports": { "../../gl.js": "../compat/gl.js" } }
</script>
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100%;height:100%}</style></head>
<body>
<script type="module">
import { THREE, TSL } from '../lib.js';
import { Engine, QUALITY3 } from '../engine.js';
import { Sky } from '../sky.js';
import { Rain } from '../rain.js';
import { makeNoiseTexture, makeCloudTexture } from '../../world/textures.js';
import { textureOf } from '../convert.js';
import { buildEnvState } from '../../env/state.js';
import { presetById, presetRunway } from '../../env/presets.js';
import * as SM from '../../env/atmo/sky_model.js';
import * as EX from '../../env/atmo/exposure.js';
import * as WX from '../../env/atmo/weather_fx.js';
const q = new URLSearchParams(location.search); const out = { ok: false };
try {
  const c = document.createElement('canvas'); document.body.appendChild(c);
  const E = await new Engine(document.body, QUALITY3[q.get('tier') || 'low'], { canvas: c }).init(); E.resize(innerWidth, innerHeight, 1);
  const S = E.scene;
  const noise = textureOf(makeNoiseTexture()); noise.wrapS = noise.wrapT = THREE.RepeatWrapping;
  const cloudRec = makeCloudTexture(11); const clouds = textureOf(cloudRec); clouds.wrapS = clouds.wrapT = THREE.RepeatWrapping;
  let rec = cloudRec; while (rec && !rec.isTexRecord) rec = rec.tex; out.cloudData = !!(rec && rec.data);
  const dist = SM.detailDistribution(rec && rec.data ? SM.histogram8(rec.data) : new Float64Array(256).fill(1 / 256));
  const p = presetById(q.get('wx') || 'marine_layer');
  const st = buildEnvState(Date.parse(p.time_utc), { mode: 'snapshot', overridden: true, reports: [p.metar], live: true, rwyOverride: presetRunway(p), groundY: 3 });
  const sky = new Sky(E, { cloudTex: clouds, noiseTex: noise, baseRes: 256 });
  const cal = SM.sunCalibration(st); const k = cal.k ?? 0.167;
  const env = { sunDir: st.sun.dir, mie: 21e-6, sunI: 20 * k, fog: [0, 1, 1, 1], cloud: [0, 1000, 4000, 0.5], cloudWind: [0, 0], refPos: [0, 60, 0], slab: false, physical: true };
  const L = SM.cloudAdjust(Sky.lightFor(env), st); const ns = SM.nightSkyLuminance(st).units; L.skyFloor = [ns, ns, ns];
  const expo = EX.exposureForEV(EX.clampEV(st.exposure.ev100Target, st.sun.elTrue)); const pre = EX.preExposure(null, expo);
  sky.pre = pre; sky.setEnv(env); sky.applyLight(L);
  const slabs = SM.renderSlabs(st); sky.setSlabs(slabs, L.skyUp.map((v, i) => v * 0.8 + L.ground[i] * 0.2), SM.sstep(2e-4, 2e-3, st.atm.sigmaSurface));
  const layers = SM.cloudLayers(st, dist); sky.setLayers(layers); sky.setMoon(st.moon.el > -1 ? SM.moonDisc(st) : null);
  const wet = WX.wetStart(st); sky.u.wetFilm.value = wet.film; sky.u.wetPore.value = wet.pore; sky.u.puddle.value = 0.5;
  sky.u.lightDir.value.set(...st.sun.dir);
  S.backgroundNode = sky.backgroundNode(); S.fogNode = sky.fogNode();
  sky.renderSky(E.renderer); sky.updateEnvironment(E.renderer, S);
  const sun = E.sun; const sunRad = TSL.uniform(new THREE.Vector3(...L.sunColor.map(v => v * pre))); sun.colorNode = sunRad.mul(sky.cloudShadow(TSL.positionWorld)); E.setSun(st.sun.dir, L.sunColor);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000).rotateX(-Math.PI / 2), new THREE.MeshStandardNodeMaterial({ color: 0x777777, roughness: 0.9 })); g.position.y = 3; g.receiveShadow = true; S.add(g);
  for (let i = 0; i < 8; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(20, 30 + i * 30, 20), new THREE.MeshStandardNodeMaterial({ color: 0xbbbbbb })); b.position.set(-200 + i * 60, 3 + (30 + i * 30) / 2, -300 - i * 200); b.castShadow = b.receiveShadow = true; S.add(b); }
  const centre = TSL.uniform(new THREE.Vector2(0, 0)); let planes = 0;
  const N = 16, pos = [], idx = []; for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) pos.push(i / N * 2 - 1, 0, j / N * 2 - 1);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const a = j * (N + 1) + i; idx.push(a, a + N + 1, a + 1, a + 1, a + N + 1, a + N + 2); }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3)); pg.setIndex(idx);
  layers.forEach((l, k) => { if (!l.slab) return; for (const top of [false, true]) { const m = new THREE.Mesh(pg, sky.cloudSlabMaterial(k, top, centre)); m.frustumCulled = false; m.renderOrder = 5; S.add(m); planes++; } });
  const rain = new Rain(20000, { depthNode: E.depthNode }); E.fxScene.add(rain.mesh);
  const RP = WX.rainParams(st.precip || { kind: 'rain', rateMmH: 4 }, 'low', [2, 1]);
  const cam = (q.get('cam') || '0,40,400,0,4').split(',').map(Number);
  const yaw = cam[3] * Math.PI / 180, pit = cam[4] * Math.PI / 180;
  const dir = [Math.sin(yaw) * Math.cos(pit), Math.sin(pit), -Math.cos(yaw) * Math.cos(pit)];
  E.expo.value = expo / pre; S.environmentIntensity = 1;
  const t0 = performance.now(); const nF = +(q.get('n') || 3);
  for (let f = 0; f < nF; f++) {
    E.setCamera({ pos: cam.slice(0, 3), dir, fov: 50 * Math.PI / 180, near: 0.5, far: 180000 }, innerWidth, innerHeight);
    rain.update(RP, { pos: cam.slice(0, 3) }, f / 60, L.skyUp.map(v => v * 0.6 * pre), 1e6, 2 * Math.tan(25 * Math.PI / 180) / innerHeight);
    E.render();
  }
  const rt = E.meter.renderTarget; const px = await E.renderer.readRenderTargetPixelsAsync(rt, 0, 0, rt.width, rt.height);
  const n = rt.width * rt.height, half = px instanceof Uint16Array, stp = Math.round(px.length / n); const Lu = new Float32Array(n);
  for (let i = 0; i < n; i++) { const v = px[i * stp]; Lu[i] = (half ? THREE.DataUtils.fromHalfFloat(v) : v) / pre; }
  const m = EX.meter(Lu, rt.width, rt.height);
  Object.assign(out, { ok: true, ms: Math.round(performance.now() - t0), backend: E.backend, preset: p.id, pre, expo, ev100Target: st.exposure.ev100Target, metered: m, pxType: px.constructor.name, pxLen: px.length, layers: layers.length, planes, slabs: slabs.length, rain: RP.count, k });
} catch (e) { out.err = String(e && e.stack || e); console.error(e); }
window.__skytest = out; console.log('SKYTEST ' + JSON.stringify(out));
</script>
</body></html>
