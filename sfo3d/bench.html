<!doctype html><html><body><canvas id=c width=4 height=4></canvas><script>
const gl = document.getElementById('c').getContext('webgl2',{antialias:false});
gl.getExtension('EXT_color_buffer_float');
function sh(type, src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);return p;}
window.bench = async function(W,H,msaa,tris,octaves){
  const out={};
  const rb=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,rb);
  if(msaa>1) gl.renderbufferStorageMultisample(gl.RENDERBUFFER,msaa,gl.RGBA16F,W,H); else gl.renderbufferStorage(gl.RENDERBUFFER,gl.RGBA16F,W,H);
  const db=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,db);
  if(msaa>1) gl.renderbufferStorageMultisample(gl.RENDERBUFFER,msaa,gl.DEPTH_COMPONENT24,W,H); else gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,W,H);
  const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,rb);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,db);
  gl.viewport(0,0,W,H);
  // fullscreen heavy shader
  const p=prog(`#version 300 es
  in vec2 a; out vec2 uv; void main(){uv=a*.5+.5;gl_Position=vec4(a,0.5,1);}`,`#version 300 es
  precision highp float; in vec2 uv; out vec4 o;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
  void main(){float s=0.,a=.5;vec2 p=uv*8.;for(int i=0;i<${octaves};i++){s+=a*n(p);p*=2.03;a*=.5;}o=vec4(s,s*s,sqrt(s),1);}`);
  const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.useProgram(p);const loc=gl.getAttribLocation(p,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const px=new Float32Array(4); const sync=()=>gl.readPixels(0,0,1,1,gl.RGBA,gl.FLOAT,px);
  sync(); let t0=performance.now();
  for(let i=0;i<3;i++){gl.drawArrays(gl.TRIANGLES,0,3);}
   sync();out.fullscreen_ms=(performance.now()-t0)/3;
  // triangle test: many small triangles grid
  const N=Math.ceil(Math.sqrt(tris/2)); const pos=new Float32Array((N+1)*(N+1)*3); let k=0;
  for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){pos[k++]=i/N*2-1;pos[k++]=j/N*2-1;pos[k++]=Math.sin(i*.3)*Math.cos(j*.2)*.1;}
  const idx=new Uint32Array(N*N*6);k=0;for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=j*(N+1)+i;idx[k++]=a;idx[k++]=a+1;idx[k++]=a+N+1;idx[k++]=a+1;idx[k++]=a+N+2;idx[k++]=a+N+1;}
  const p2=prog(`#version 300 es
  in vec3 a; out vec3 v; void main(){v=a;gl_Position=vec4(a.xy*0.9,a.z,1);}`,`#version 300 es
  precision highp float; in vec3 v; out vec4 o; void main(){vec3 n=normalize(cross(dFdx(v),dFdy(v)));o=vec4(n*.5+.5,1);}`);
  const vb2=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb2);gl.bufferData(gl.ARRAY_BUFFER,pos,gl.STATIC_DRAW);
  const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  gl.useProgram(p2);const l2=gl.getAttribLocation(p2,'a');gl.enableVertexAttribArray(l2);gl.vertexAttribPointer(l2,3,gl.FLOAT,false,0,0);
  gl.enable(gl.DEPTH_TEST);
  sync();t0=performance.now();
  for(let i=0;i<3;i++){gl.clear(gl.DEPTH_BUFFER_BIT);gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_INT,0);}
  sync(); out.tris_ms=(performance.now()-t0)/3; out.ntris=idx.length/3;
  // readback test
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texStorage2D(gl.TEXTURE_2D,1,gl.RGBA8,W,H);
  const fb2=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb2);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  const buf=new Uint8Array(W*H*4); t0=performance.now(); gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,buf); out.read_ms=performance.now()-t0;
  t0=performance.now(); await fetch('/frame',{method:'POST',body:buf}); out.post_ms=performance.now()-t0;
  return out;
}
</script></body></html>
